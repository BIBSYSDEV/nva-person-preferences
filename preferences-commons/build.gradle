plugins {
    id 'nva.person.preferences.java-conventions'
}

dependencies {
    api(nvaCatalog.aws.sdk.dynamo)
    api(nvaCatalog.jackson.annotations)
    api(nvaCatalog.jackson.databind)
    api(nvaLibs.apigateway)
    implementation(nvaLibs.core)
    implementation(nvaLibs.json)
    implementation(project(":preferences-storage"))
    testImplementation(nvaCatalog.hamcrest)
    testImplementation(nvaCatalog.jackson.core)
    testImplementation(nvaCatalog.junit.jupiter.api)
    testImplementation(nvaLibs.testutils)
    testImplementation(project(":preferences-test-support"))
    testImplementation(project(':preferences-test-support'))
}

test {
    environment "ALLOWED_ORIGIN", "*"
    environment "TABLE_NAME", "nonExistentTable"
}
