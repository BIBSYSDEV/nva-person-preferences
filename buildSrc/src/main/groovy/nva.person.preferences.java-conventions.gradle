plugins {
    id 'nva.java-conventions'
}

nva {
    errorprone {
        allErrorsAsWarnings = false
    }
    java {
        languageVersion = 25
    }
    pmd {
        analyzeTests = false
        excludedRules = [
                'AvoidCatchingGenericException'
        ]
    }
    spotless {
        enabled = true
    }
}

test {
    // DynamoDBLocal loads the native sqlite4java library via System.load, which JDK 24+
    // (JEP 472) warns about today and will block in a future release.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    environment("ALLOWED_ORIGIN", "*")
    environment("API_HOST", "api.fake.nva.aws.unit.no")
    environment("COGNITO_AUTHORIZER_URLS", "http://localhost:3000")
    environment("LOG4J_CONFIGURATION_FILE", "classpath:nva-log4j2.xml")
    environment("LOG_LEVEL", "info")
    environment("TABLE_NAME", "nonExistentTable")
}
